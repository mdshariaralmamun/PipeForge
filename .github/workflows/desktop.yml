# Build desktop installers for Windows, macOS and Linux (manual trigger:
# GitHub → Actions → "Desktop installers" → Run workflow).
# Installers upload to the rolling "desktop-latest" release, giving stable
# public download URLs:
#   .../releases/latest/download/PipeForge-win.exe
#   .../releases/latest/download/PipeForge-mac.dmg
#   .../releases/latest/download/PipeForge-linux.AppImage
name: Desktop installers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-desktop.mjs
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux
      - name: Upload installers to the desktop-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: PipeForge desktop app
          files: dist-desktop/PipeForge-*
